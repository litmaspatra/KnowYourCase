name: Build Notice Tracker Debug

on:
  pull_request:
    branches: [ notice-tracker-ci-base ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Compile Notice Tracker debug APK
        run: ./gradlew :noticeapp:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoticeTracker-debug
          path: noticeapp/build/outputs/apk/debug/noticeapp-debug.apk
          if-no-files-found: error
