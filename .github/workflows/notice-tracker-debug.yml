name: Build Notice Tracker Debug

on:
  pull_request:
    branches: [ notice-tracker-ci-base ]
  push:
    branches: [ notice-tracker-debug ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep earlier native UI migration idempotent
        run: python3 .github/scripts/apply_apper_native_ui.py

      - name: Apply process-server allotment and receive workflow
        run: python3 .github/scripts/apply_process_server_workflow.py

      - name: Final process-workflow hardening
        run: python3 .github/scripts/finalize_process_workflow.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x gradlew

      - name: UI design-system audit
        run: python3 noticeapp/ui_audit.py

      - name: Lint Notice Tracker
        run: ./gradlew :noticeapp:lintDebug --stacktrace

      - name: Compile Notice Tracker
        run: ./gradlew :noticeapp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoticeTracker-v0.8.0-process-workflow-debug
          path: noticeapp/build/outputs/apk/debug/noticeapp-debug.apk
          if-no-files-found: error

      - name: Commit successful source migration
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticeapp/src/main/java/com/knowyourcase/notice/MainActivity.kt noticeapp/src/main/java/com/knowyourcase/notice/NoticeDatabase.kt noticeapp/build.gradle
          git commit -m "Finalize process-server allotment and receive workflow"
          git push origin HEAD:notice-tracker-debug
