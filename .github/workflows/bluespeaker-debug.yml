name: Build BlueSpeaker Debug APK
on:
  push:
    branches:
      - bluespeaker-build-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p bluespeaker-build/android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BlueSpeaker-debug-apk
          path: bluespeaker-build/android/app/build/outputs/apk/debug/app-debug.apk
