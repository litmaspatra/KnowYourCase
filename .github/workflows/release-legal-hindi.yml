name: Build and release KnowYourCase v1.1.0

on:
  push:
    branches:
      - main
      - legal-hindi-v1.1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KnowYourCase-v1.1.0.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1.0 --cleanup-tag --yes 2>/dev/null || true
          gh release create v1.1.0 KnowYourCase-v1.1.0.apk \
            --title "KnowYourCase v1.1.0" \
            --target "${GITHUB_SHA}" \
            --notes-file - <<'EOF'
          # KnowYourCase v1.1.0

          ## Legal Hindi engine
          - Replaces the Google ML Kit Hindi translation model with a compact offline legal-Hindi engine.
          - No first-use ~30 MB Hindi model download.
          - Party and advocate names are transliterated instead of semantically translated.
          - Adds fixed Indian court terminology and common Rajasthan place/name spellings.
          - Adds deterministic handling for case stages, notices, hearings, court names, acts and sections.
          - Keeps a bundled fallback transliterator for Android 8 and 9.

          ## Verification
          - Translation unit tests run before APK creation.
          - APK is only released if tests and the Android build both succeed.

          This remains an independent convenience app and is not affiliated with or endorsed by eCourts or any court.
          EOF
